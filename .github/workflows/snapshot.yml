# The public instance serves demo.db.gz. This fails the push when that snapshot no longer
# matches the code (a new column, a new list, a list short of companies) — the way the
# ★ India page went empty in production without anyone being told.
name: snapshot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev
      - run: gunzip -k demo.db.gz
      - run: uv run --frozen --no-dev python scripts/smoke.py --db demo.db

  # Every push to main that passes the check above ships the read-only backend to Catalyst
  # AppSail. The CLI can only deploy to Development (production is a console promotion),
  # so Development is the live backend the Vercel dashboard proxies to.
  deploy:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: catalyst-deploy, cancel-in-progress: false }
    env:
      API: https://zonuly-api-50046893527.development.catalystappsail.in
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g zcatalyst-cli@1.28.0
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen --no-dev python scripts/build_catalyst.py
        # Sign-in settings ride into app-config.json from repository secrets (never the repo).
        # Unset secrets are simply left out; ZONULY_AUTH=1 is what turns the login gate on.
        env:
          ZONULY_AUTH: ${{ secrets.ZONULY_AUTH }}
          ZONULY_SESSION_SECRET: ${{ secrets.ZONULY_SESSION_SECRET }}
          ZONULY_PUBLIC_URL: ${{ secrets.ZONULY_PUBLIC_URL }}
          ZONULY_MAIL_FROM: ${{ secrets.ZONULY_MAIL_FROM }}
          ZONULY_GOOGLE_CLIENT_ID: ${{ secrets.ZONULY_GOOGLE_CLIENT_ID }}
          ZONULY_GOOGLE_CLIENT_SECRET: ${{ secrets.ZONULY_GOOGLE_CLIENT_SECRET }}
          ZONULY_SMTP_HOST: ${{ secrets.ZONULY_SMTP_HOST }}
          ZONULY_SMTP_PORT: ${{ secrets.ZONULY_SMTP_PORT }}
          ZONULY_SMTP_USER: ${{ secrets.ZONULY_SMTP_USER }}
          ZONULY_SMTP_PASSWORD: ${{ secrets.ZONULY_SMTP_PASSWORD }}
      - name: Deploy to Catalyst Development
        working-directory: deploy/catalyst
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::error::Repository secret CATALYST_TOKEN is not set (catalyst token:generate, then gh secret set CATALYST_TOKEN)"
            exit 1
          fi
          # A fresh runner has no CLI state: .catalystrc alone does not name the org, and the
          # data centre defaults to US — this account (and its token) lives on zoho.in.
          catalyst deploy --only appsail --dc in --project 84632000000013053 --org 60091917121 --token "$CATALYST_TOKEN" -ni
      - name: Wait for it to answer, then smoke-test it
        env:
          ZONULY_SESSION_SECRET: ${{ secrets.ZONULY_SESSION_SECRET }}
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API/api/health")" = 200 ] && break
            sleep 10
          done
          # a fresh instance unpacks the snapshot and warms its cache before every route answers
          for try in 1 2 3 4; do
            uv run --frozen --no-dev python scripts/smoke.py "$API" && exit 0
            sleep 30
          done
          exit 1
