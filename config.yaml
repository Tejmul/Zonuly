  budget_seconds: 2400
  share:
    leads: 0.7
    companies: 0.3
    people_when_referral_job: 0.3   # 2026-10-14: the tick's people step keeps this share while com.zonuly.referrals is loaded
  github_min_remaining: 20      # GitHub mining for a company only while this many calls are left (60/h unauthenticated)
  people_per_tick: 150          # 2026-10-08: referrers first — the people step runs before every other fill step (referrals.py)
  people_budget_seconds: 1500   # …and stops after 25 min of a tick; the keyless search paces itself (Jina ≈ 20/min)
  reverify_per_tick: 150        # ready referrers whose evidence is > 90 days old, re-confirmed
  revalidate_per_tick: 30       # companies re-checked (website answers, description passes, careers lists roles)
  verify_per_tick: 120
  describe_per_tick: 40
  story_per_tick: 40
  facts_per_tick: 90
  levels_per_tick: 60
  exa_discovery_queries_per_day: 6
  # 2026-10-06: hourly free-tick additions (keyless) and the paced paid slice.
  websites_per_tick: 120       # name-only companies -> verified website (hosted Exa MCP + direct fetch)
  facts_keyless_per_tick: 40   # funding/HQ/website via the hosted Exa MCP (paced; retries a 429, cools down, resumes)
  careers_per_tick: 40         # 2026-10-07: careers page + roles for any company (careers.py), list rows first
  india_discovery_per_tick: 80 # 2026-10-14: raised from 30 — India focus until the user says otherwise. 2026-10-08: new Bengaluru/Hyderabad startups per tick (india.py), after the ★ list and fill work
  fill_per_tick: 20            # 2026-10-14 (raised from 8 for the India focus): companies scraped completely per tick (fill.py): ★ list → India → remote
  fill_budget_seconds: 900     # …at most this long (2026-10-14: 360 -> 900 for 20 a tick)
  fill_linkedin_reads_per_tick: 6    # public LinkedIn company + jobs pages (guest, via Jina, paced, 12h stop on a block)
  # The paid per-day totals above (facts/describe/story/levels) and the research caps
