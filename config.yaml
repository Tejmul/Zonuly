    - lucknow
    - trivandrum
    - nagpur
    - mysuru
    - goa
  # PRIORITY 0-100, stored on company.priority_score with the sentence in priority_why.
  # The four parts add up to 100; tune the weights here (targeting.priority).
  priority:
    stages:              # recently funded at one of these rounds scores
    - Pre-seed
    - Seed
    - Series A
    - Series B
    - Series C
    fresh_months: 6      # announced within this -> the full funding score
    recent_months: 18    # within this -> most of it
    weights:
      funding: 35        # recently funded at an early round
      hiring: 35         # verified hiring, open roles; fresher and remote-anywhere weigh most
      pay: 20            # pay power band
      valuation: 10      # valuation (or round size) sane for the stage
    # 2026-10-13: a non-senior, full-time posting that itself states at least this much
    # (₹ LPA) adds the boost on top ("posting states ₹37 LPA for SDE-1 (+15)")
    stated_pay_boost_lpa: 30
    stated_pay_boost: 15
    # the most a round of this stage is usually valued at, $M — above it, the company is
    # priced like a later one (hype), and the valuation part scores low
    stage_valuation_max_usd_m:
      Pre-seed: 30
      Seed: 80
      Series A: 300
      Series B: 1000
      Series C: 3000
