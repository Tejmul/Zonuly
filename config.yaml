tick:
  free_interval_seconds: 600   # 2026-10-07: round the clock — a tick holds a lock, so a start that finds one running just exits
  socket_timeout_seconds: 120  # 2026-10-16: default timeout for any socket opened without one (tick + referrals)
  paid_hour: 6
  paid_minute: 15
  # 2026-10-14 "leads first": a tick's working time is split — leads (people, addresses,
