  # the cold signature (2026-10-17): name, this line, LinkedIn — one link, no link row
  signature_line: Final-year B.Tech CS+AI, Newton School of Technology
  # ---- launch (2026-10-14, first live sends Mon 2026-10-19) — outreach/warmup.py,
  # outreach/suppress.py, outreach/preflight.py. These only ever LOWER what goes out:
  # the 25/day cap, the 5/day guessed cap and the review gate are untouched.
  # A fresh sending pattern on a personal Gmail ramps up: the day's quota is
  # min(daily_send_cap, first + step * (sending_day // every)) — Mon 5, Tue 5, Wed 10,
  # Thu 10, Fri 15, then 15, 20, 20, 25 (25 from Thu of the second week).
  warmup:
    start: '2026-10-19'
    first: 5
    step: 5
    every: 2
  send_days: [mon, tue, wed, thu, fri]   # no cold mail at weekends
  # sends are spread across the window at jittered times (no bursts): ±jitter_fraction
  # of the gap between two slots, and at most max_per_run in one run of the send agent
  pacing:
    jitter_fraction: 0.35
    max_per_run: 2
  # every cold email carries this line, above the signature (added on approval)
  # (2026-10-17: shorter and humane; the old line is still recognised in bodies and quoted replies —
  # outreach/suppress.py LEGACY_OPT_OUT_LINES)
  opt_out_line: If you'd rather not hear from me again, just say so and I won't write.
  # a guessed address that bounces hurts the account: this many bounces inside window_days
  # and no guessed address is sent to until they age out (verified addresses still go)
  bounce_brake:
    window_days: 7
    max_bounces: 2
  # never written to, whatever the pipeline finds: addresses, whole domains, company names
  do_not_contact:
    emails: []
    domains: []
    companies: []
  # the review queue should hold at least this many approved drafts the evening before a send day
  min_approved_for_day: 5
  # ---- pattern approval (2026-10-16, outreach/patterns.py). Off = every email waits for
  # your own approval, as before. On = a draft of a kind you approved as a pattern (from the
  # review queue: "Approve + use for every email like this") is written from your template
  # and approved without a click IF every gate passes; it is marked "auto-approved by
  # pattern #N" and can be undone — or the pattern revoked — until its send slot. The send
  # cap, warm-up, window, suppression and bounce brake still decide what leaves.
  # Read live: no restart needed after changing it.
  pattern_approval: false
  pattern_min_quality: 75      # a pattern's email scoring under this waits for you
  pattern_max_waiting: 25      # at most this many pattern-approved emails queued, unsent
