gmail:
  # app_password: SMTP + IMAP with a Gmail app password in .env (GMAIL_APP_PASSWORD).
  # oauth: the Gmail API through a desktop-app client (needed only for the Calendar push).
  auth: app_password
  credentials_file: secrets/gmail_credentials.json
  token_file: secrets/gmail_token.json
calendar:
  enabled: true
  calendar_id: primary
  timezone: Asia/Kolkata
  default_minutes: 30
  conflict_window_minutes: 45
notifications:
  macos: true
sources:
