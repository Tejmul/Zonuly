    timeout: 20
harvest:
  # no headcount ceiling any more: admission judges fame, listing, valuation and money
  regions:
  - us
  - uk
  - de
  - nl
  - eu
  - india
  - remote
contacts:
  max_per_company: 20
  linkedin_min_gap_seconds: 35
  linkedin_max_per_company: 8
  # 2026-10-15: keyless search returns no LinkedIn profiles any more, so the referral job
  # starts each company with ONE Exa `category: people` search (~10 current profiles).
  # It spends research.exa_daily_cap and always leaves this many searches for the rest.
  exa_people_reserve: 15
  exa_people_max_per_company: 12
  github_token: ''
  hunter_api_key: ''
  smtp_verify: false
outreach:
  daily_send_cap: 25
  followup_after_days: 5
  max_followups: 1
  asks_per_company: 2       # open referral asks at one company at once (2026-10-17: Sarvam, two the same day)
  asks_per_company_overrides:      # by company name; 2026-10-17: everyone in Sarvam AI's Bangalore office
    Sarvam AI: 80
  send_mode: gmail          # 2026-10-17: live — first real sends (Sarvam AI, Mon 19 Oct)
  guessed_daily_cap: 8
  # 2026-10-17 ("as much as we can for free"): a personal Gmail sends cold referral asks
  # safely at ~40/day once warmed up; the ramp (warmup:) climbs 5 → 40 over ~3 weeks. Past
  # that, scale with a separate domain + inboxes, never by pushing this Gmail harder.
  daily_send_cap: 40
  draft_expiry_days: 7
  contact_cooldown_days: 30
  company_cooldown_days: 30
  # 2026-10-14 (knowledge/cold-email-playbook.md): the message itself, counted WITHOUT the
  # opt-out line and the signature. Boomerang 50–125 (75–100 peak), Gong <100, Instantly <80.
  # 2026-10-17: 60–110 words for the research structures; the user's own direct_intro pattern
  # (the default) runs 80–170 (compose.direct_min_words / direct_max_words).
  gate:
    min_words: 60
    max_words: 110
    blurb_max_words: 55
    subject_min_words: 2
    subject_max_words: 8         # the research structures keep theirs to 5 (compose.SUBJECT_MAX)
    subject_max_chars: 60
  # outreach/compose.py — the personalisation contract, the structures, the quality score
  compose:
    rewrite_below: 60          # quality under this: the draft is marked "rewrite" (kept, never deleted)
    good_from: 80
    small_team: 60             # team_size at or under this (or seed / Series A) = a small startup
    learn_min_sent: 20         # a variant needs this many sends before its rate is shown
    # which structure writes the first email (2026-10-17, the user's call): direct_intro = his own
    # pattern for everyone (who he is, 3–4 results for the role, a polite referral ask, resume
    # link); auto = the research picker (advice_first / give_first / fit_question / recruiter_direct)
    structure: direct_intro
    # 2026-10-17: the user's own email, word for word ("this looks good, use this"). Slots:
    # {first_name} {role} {company} {resume_link}. Edit the wording here, not in code.
    direct_template: |-
      Hi {first_name},

      I'm Tejmul, a final-year Computer Science and AI student at Newton School of Technology.

      In my recent internships I shipped 3 production agentic systems at MVRX Labs (YC P26), fine-tuned Mistral 7B at eWealth Tech (accuracy from 20% to 92%), and moved a product to AWS Lambda, cutting infrastructure costs by 95%.

      I saw the {role} opening at {company}, and I'd be really grateful if you would consider referring me. I'd love the chance to contribute to your team and learn from the work you're doing.

      Resume: {resume_link}
    direct_sign_off: "Thank you for your time!\n\nBest regards,"
    # his template carries no opt-out line; a "stop" / "unsubscribe" reply still suppresses
    # the person and the company forever (suppress.py)
    direct_opt_out: false
    direct_min_words: 80
    direct_max_words: 170
    max_per_company: 2         # people asked at one company in one batch
    max_per_role: 1            # people asked about one role in one batch
    # Something you built or used with a company's own product or repo, in your words —
    # turns on the give-first structure for that company. Every fact here must be true.
    #   - company: "Temporal"
    #     thing: "Temporal"                       # what you used (optional; else the company)
    #     line: "migrated a production pipeline from Trigger.dev to Temporal at MVRX Labs"   # follows "I "
    #     link: "github.com/Tejmul/..."           # optional: then it is the email's one link
    #     offer: "I wrote up what broke. It might be useful, or it might be naive."      # optional
    # Without an entry, a resume line naming their product is used (outreach/compose.py gifts).
    gifts: []
    # Short, true phrasings of the resume's quantified bullets, used as the PROOF slot.
    # `match` must appear in the resume line a covered need points at (needs brief), so a
    # proof is only ever used where the brief says it answers what the role asks for.
    # `line` follows "I ", `topic` can carry a subject line. Every word and number here is
    # on the resume (profile/profile.json) — the faithfulness gate re-checks it per draft.
    proofs:
    - match: "Trigger.dev to Temporal"
      line: "migrated a production pipeline from Trigger.dev to Temporal at MVRX Labs (YC-P26), cutting infra cost 95%"
      topic: "Temporal migration, 95% cheaper"
    - match: "Built GTM OS"
      line: "built GTM OS at MVRX Labs, an agentic system that scrapes CEO and CTO posts and leads for 10+ YC clients (85% rise in client engagement)"
      topic: "an agentic GTM system for 10+ YC clients"
    - match: "Architected ChokePoints"
      line: "architected ChokePoints, a guardrailed LLM pipeline tracking 27,000+ public companies, with human-reviewed newsletters"
      topic: "an LLM pipeline over 27,000+ companies"
    - match: "Shipped 3 production agentic systems"
      line: "shipped 3 production agentic systems solo for a GTM agency serving 10+ YC clients"
      topic: "3 agentic systems shipped solo"
    - match: "Fine-tuned Mistral 7B"
      line: "fine-tuned Mistral 7B with LoRA/QLoRA at eWealth Tech, lifting response accuracy from 20% to 92%"
      topic: "Mistral 7B fine-tune, 20% to 92%"
    - match: "latency by 88%"
      line: "cut end-to-end AI response latency by 88% at eWealth Tech with SSE streaming"
      topic: "88% lower LLM latency"
