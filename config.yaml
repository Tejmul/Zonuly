openrouter:
  enabled: true
  base_url: https://openrouter.ai/api/v1
  default_alias: cheap
  free_only: true
  # 2026-09-22: both MiniMax free ids vanished from the roster and nemotron-3-super spends
  # its 500 output tokens thinking, so research JSON came back truncated. nex-n2.5 answered
  # clean JSON in ~3s; gemma/qwen were at the free daily ceiling. Re-check with
  # `python scripts/run.py models list --free` when a stage starts failing.
  # 2026-10-06: nex-n2.5 went paid-only and every stage failed at once. Each alias is now
  # a ranked chain; a call moves down it when a model is gone or rate-limited. Probed that
  # day for clean JSON: laguna-s-2.1 and nemotron-3-super ~4s, dots-3-note ~8s; gemma-4
  # and apodex were at their free ceiling, inkling is gated (403).
  aliases:
    cheap:
    - poolside/laguna-s-2.1:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - dots-studio/dots-3-note-preview:free
    - google/gemma-4-31b-it:free
    - apodex/apodex-1.1-mini:free
    judge:
    - nvidia/nemotron-3-super-120b-a12b:free
    - poolside/laguna-s-2.1:free
    - google/gemma-4-31b-it:free
    - dots-studio/dots-3-note-preview:free
    writer:
    - nvidia/nemotron-3-super-120b-a12b:free
    - google/gemma-4-31b-it:free
    - poolside/laguna-s-2.1:free
    - dots-studio/dots-3-note-preview:free
  requests_per_minute: 18
  daily_inr_cap: 100
  monthly_inr_cap: 2500
  usd_to_inr: 88
  max_tokens: 1200
  temperature: 0.3
  timeout: 180
  app_title: ZoNuLy JobHunter
