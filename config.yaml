  - Gitforce
# SELECTION CONFIDENCE (jobhunter/confidence.py, 2026-10-14): the odds THIS role selects us,
# 0-100, one engine with a weight profile per market. Each profile's weights sum to 100; a
# term is a value 0..1 times its weight, and every term says why (quote + URL). Blockers CAP
# the score; the band is the threshold table. Roles on-site abroad use the remote profile
# and the onsite_elsewhere cap. Changing any number here re-scores every role next tick.
confidence:
  bands:            # score >= high -> High, >= medium -> Medium, >= low -> Low, else Long shot
    high: 65
    medium: 48
    low: 30
  india:            # Bengaluru / Hyderabad, on-site or hybrid
    weights:
      fresher: 22   # experience bar / title vs a 2027 grad — the biggest single filter
      skills: 16    # resume↔JD stack (skill dictionary + lexical fit; the judge rubric refines)
      gap: 8        # share of the needs brief the resume covers
      pay: 12       # ≥ ₹20 L evidence
      stage: 8      # smaller company / earlier stage = fewer applicants
      recency: 7
      referral: 15  # a ready referrer with an address — the strongest lever
      city: 6
      hiring: 6     # hiring proven on their own careers page / board
  remote:           # remote-anywhere / remote-from-India
    weights:
      remote_terms: 14   # the posting's own remote-anywhere / no-visa language
      timezone: 8        # IST overlap
      async: 4           # async / written culture
      skills: 15
      gap: 8
      seniority: 13
      intl_hiring: 6     # contractors, EOR, other remote-anywhere roles
      stage: 6
      referral: 13
      competition: 5     # famous / hyped / public board -> lower
      recency: 4
      hiring: 4
  caps:             # a blocker caps the score at this
    visa: 10
    onsite_elsewhere: 20
    remote_country: 15
    india_other_city: 20
    years_5plus: 30
    years_3to4: 60
    senior_title: 35
    overrated: 30
    below_pay: 35
    language: 25
    not_authorized: 40
    stale_posting: 40
    low_stipend: 30
    inactive_company: 10
    off_target_title: 40
    gig: 45
  tick:
    recompute_per_tick: 3000     # roles re-scored per tick (only those whose inputs changed)
    recompute_seconds: 240
    briefs_per_tick: 4           # needs briefs (re)built per tick, best roles first
    brief_top: 50                # per market: briefs are kept for the top N roles
    synth_per_tick: 2            # model syntheses per tick (free chain; stops at the daily ceiling)
    context_per_tick: 2          # companies whose public context (keyless search + GitHub) is fetched
    brief_seconds: 120
# NEEDS ANALYSIS (jobhunter/needs.py): what they actually need, mapped to the resume
needs:
  context_ttl_days: 14     # public context per company (search results, repos) is reused this long
  brief_ttl_days: 14
  web_results: 6

# THE REFERRAL JOB (referrals.run_cycle, launchd com.zonuly.referrals). 2026-10-14: "activate
# the referral-finding module so it ONLY scrapes referrals, for India — Bengaluru as priority".
# Bengaluru (★ first) → Hyderabad → other India → remote; its own lock (data/referrals.lock).
referrals:
  interval_seconds: 900     # every 15 min (+ at load)
  cycle_seconds: 1200       # the work budget of one cycle; a cycle still running blocks the next (the lock)
  only_buckets: [Bengaluru, Hyderabad]   # 2026-10-17: India focus, Bengaluru first; remove to work every bucket again
  cycle_companies: 40       # companies per cycle (the claimed window)
  search_down_tail: 6       # companies still worked (no web search) once every keyless backend cools, then stop
  skip_touched_minutes: 60  # a company another worker touched this recently is left alone
