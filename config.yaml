  # India: only these two cities count; the rest are never India targets
  india:
    # PAY FLOOR (Tejmul, 2026-10-08: "even in India, the companies which pay less than 20
    # lakhs, remove them"). An India company whose BEST evidence of full-time fresher /
    # early-career pay is under this is hidden (company.status = below_pay_bar), never
    # deleted; any evidence at or above it keeps it; unknown pay keeps it. Internship
    # stipends are not full-time pay. Re-evaluated every tick (jobhunter/india.py).
    # 2026-10-15: raised to 25 ("scrap the Indian companies where cap is 25 lpa and +").
    min_lpa: 25
    # a stated full-time figure below this is a misparse (a monthly number read as
    # annual), not evidence — it is ignored rather than allowed to hide a company
    implausible_below_lpa: 3
    # India discovery (jobhunter/india.py): underrated Bengaluru / Hyderabad startups.
    # Recently funded preferred; a candidate is admitted only with a quote that places
    # it in one of the two cities.
    discovery:
      fresh_months: 24
      stages: [Pre-seed, Seed, Series A, Series B, Series C]
      # a newly found India company is filled (careers, roles, facts, people) right after
      # the ★ list for this many days (db.fill_order)
      fill_first_days: 30
      # 2026-10-14 (jobhunter/india_sources.py): companies listed by city, not by a
      # funding headline. Work per discovery pass; 0 turns a source off. Every candidate
      # still needs a Bengaluru / Hyderabad quote + URL and the admission gate.
      sources:
        order: [rss, directory, yc, github, cutshort, portfolio, search, wellfound, ats]
        github_searches: 1        # GitHub org-search pages (100 orgs each; search quota 10/min, unauthenticated)
        github_orgs: 25           # github.com org pages read for website + location
        cutshort_pages: 2         # Cutshort Bengaluru / Hyderabad job-list pages (server-rendered data)
        portfolio_companies: 20   # VC / incubator portfolio entries resolved (the company's own site read)
        wellfound_pages: 1        # Wellfound role × city pages through Jina Reader
        gap_seconds: 3.5          # at least this long between two requests to one host
    cities:
      Bengaluru:
      - bengaluru
      - bangalore
      - blr
      Hyderabad:
      - hyderabad
      - secunderabad
