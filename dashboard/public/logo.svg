<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ZoNuLy — Threshold: a solid tile with the route cut through it, ending in a person. -->
  <style>
    .tile { fill: #09090b; }
    @media (prefers-color-scheme: dark) { .tile { fill: #fafafa; } }
  </style>
  <mask id="m">
    <rect width="32" height="32" fill="#fff"/>
    <path d="M8.5 9.5H22.5L9.5 22.5H19" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23.2" cy="22.5" r="4" fill="#000"/>
    <circle cx="23.2" cy="22.5" r="1.7" fill="#fff"/>
  </mask>
  <rect class="tile" width="32" height="32" rx="9" mask="url(#m)"/>
</svg>
