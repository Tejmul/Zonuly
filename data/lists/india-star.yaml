#
# This file is the list; the database only mirrors it (company.list_key = "india-star").
#   python scripts/run.py lists sync india-star      # create/attach rows, verify websites
#   python scripts/run.py lists people india-star    # find referrers at every company
#
# Every field except `website` is copied from the report. `website` is a best guess and is
# only written to the database once the site has been fetched and names the company on
# its own page — a guess that fails that check stays null and is shown as "no website".
# `website_verified: true` skips that check for a domain that is not in doubt but blocks bots.
# `ctc_kind`: indicative = a market range, not the company's promise; reported = a
# publicly posted, role-specific figure. Nothing here is a scored fact; grading still runs.
