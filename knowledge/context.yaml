  # ---- scrape
  - id: feature:ats-json-scrapers
    label: ATS public JSON APIs — Greenhouse, Lever, Ashby
    summary: Startups embed an ATS; its board endpoint is public JSON. The whole game. 94 boards live-verified in companies.yaml.
    status: built
    stage: stage:scrape
    proposed_by: [arch:plan, arch:architecture, arch:tools, arch:orchestration, arch:gemini]
    serves: [constraint:free-tier]
    implemented_in: [module:jobhunter.scrapers]
  - id: feature:aggregator-scrapers
    label: HN Who-is-Hiring, RemoteOK, WeWorkRemotely, YC directory
    summary: The places a funded 40-person company posts before anyone aggregates it. HN is freeform and needs the model; the rest are feeds.
    status: built
    stage: stage:scrape
    proposed_by: [arch:plan, arch:tools, arch:orchestration]
    serves: [constraint:free-tier]
    implemented_in: [module:jobhunter.scrapers]
  - id: feature:company-registry-yaml
    label: companies.yaml — curated, live-probed ATS registry that compounds
    summary: ATS APIs are keyed by slug so you need a company list first. `discover` probes YC companies and appends hits. The registry is the real asset.
    status: built
    stage: stage:scrape
    proposed_by: [arch:architecture, arch:tools, arch:plan]
    implemented_in: [module:jobhunter.pipeline, module:jobhunter.scrapers]
  - id: feature:fault-isolated-sources
    label: One dead source never kills a run
    summary: Every scraper is individually try/except'd; ScrapeStats.errors records which failed and per_source counts are kept every run.
    status: built
    stage: stage:scrape
    proposed_by: [arch:orchestration, arch:architecture]
    implemented_in: [module:jobhunter.pipeline]
  - id: feature:circuit-breaker-source-health
    label: Per-source circuit breaker with a source_health table
    summary: Three consecutive failures disable a source for the cycle. Replaced by simple fault isolation — a run is one shot, not a long workflow.
    status: dropped
    stage: stage:scrape
    proposed_by: [arch:orchestration]
    replaces: [feature:fault-isolated-sources]
  - id: feature:source-freshness-alarm
    label: A source returning 0 twice running is reported as a failure
    summary: The most likely way the system dies without anyone noticing — a board changes shape, the scraper returns 0, nothing errors. per_source is recorded; the alarm isn't.
    status: gap
    stage: stage:scrape
    proposed_by: [arch:orchestration, arch:final]
  - id: feature:playwright-india-boards
    label: Playwright scrapers for Wellfound, Cutshort, Instahyre
    summary: They carry the Indian salary data the JSON boards don't. Registered and toggled off — slowest, most fragile, ToS exposure.
