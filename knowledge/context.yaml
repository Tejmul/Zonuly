# ------------------------------------------------------------------ features: every idea any draft proposed, and its fate
features:
  # ---- company + people targeting (built 2026-09-03)
  - id: feature:underrated-only
    label: Underrated companies only — hyped names rejected by name
    summary: >
      A household name is disqualified before any other rule runs: thousands of applications
      are already pending there, people who were selected are on waitlists, and the interview
      is DSA-gated. 120 names in config.yaml targeting.hyped, matched word-wise so "Amazon"
      is excluded and "Amazonia Labs" is not. Proved on the real registry — 24 of 263
      companies rejected as hyped, including Databricks, Stripe, OpenAI, CRED and PhonePe.
    status: built
    stage: stage:filter
    serves: [constraint:single-user-laptop]
    implemented_in: [module:jobhunter.targeting]
  - id: feature:stipend-bar-50k
    label: The ₹50k/month internship stipend bar
    summary: >
      Target companies hire freshers through a paid internship that converts to a PPO, so the
      stipend predicts the conversion package: a company that will not pay ₹50k/month for an
      intern does not pay ₹30 LPA on conversion. Under the bar is a hard reject. Internships
      are no longer excluded by title (normalize.py) and the stipend is read at scrape time
      with the sentence it came from. NOT YET BINDING ON REAL DATA — no enabled source carries
      internship postings; see gap:internship-source.
    status: partial
    stage: stage:filter
    implemented_in: [module:jobhunter.normalize, module:jobhunter.targeting, module:jobhunter.pipeline]
  - id: feature:company-tiers
    label: tier1 / tier2 / prospect — the queue order
    summary: >
      PPO or full-time package ≥ ₹30 LPA is tier1; ₹24–30 LPA is tier2 ("category two");
      below ₹24 LPA is reject. Silence is not a rejection — most postings never state a PPO,
      so a company with no pay figure that employs engineers AND has hiring confirmed on its
      own careers page grades `prospect` and stays in the queue. Every verdict carries the
      rule that produced it in company.tier_reason.
    status: built
    stage: stage:filter
    implemented_in: [module:jobhunter.targeting]
  - id: feature:global-region-targeting
    label: US · UK · Germany · Netherlands · EU · India · remote
    summary: >
      The currency gap is the thesis, so the hunt is global. Every non-India region clears
      ₹30 LPA automatically in local terms and carries a floor of 0; India carries MOTIV's
      explicit ₹30 LPA fresher floor as an annotation on the tier. Replaces the old
      India+remote allowlist as the targeting geography (search.locations_ok still gates scrape).
    status: partial
    stage: stage:filter
    implemented_in: [module:jobhunter.targeting]
  - id: feature:hiring-authenticity
    label: not_authorized — a hiring claim their own site does not back
    summary: >
      A founder posting "we're hiring" daily on X is not evidence; an aggregator listing a
      filled role is not evidence. The company's own ATS board (Greenhouse/Lever/Ashby, with
      its role titles enumerated) or its careers page has to agree. Verdicts — verified,
      role_missing, not_authorized, unreachable — with the company's own sentence quoted.
      An explicit "we do not currently have any open positions" is the strongest disconfirmation.
      Proved on real companies: Conservation Metrics is not_authorized against a live HN posting.
    status: built
    stage: stage:filter
    implemented_in: [module:jobhunter.hiring_verify]
  - id: feature:bulk-company-harvest
    label: harvest.py — N different companies that fit, then their boards, roles and grade; YC directory + Exa company search behind one admission gate
    summary: |
      MOTIV §4 step 1 at volume. The open yc-oss mirror of the YC directory (one-liner, regions,
      batch, team size) and Exa `category: company` searches (25 sites a call, inside
      research.exa_daily_cap) feed an admission gate that applies targeting's rules before a row
      exists — hyped names, regions outside harvest.regions, teams over max_team are skipped.
      Then ATS probe (a live board = hiring verified), roles through pipeline.persist, grade.
      First run 2026-09-03: 376 → 1,879 companies, 1,826 fitting, 541 with a live board, 479 with
      relevant roles (1,271 of 9,226 read), tier1 220. `harvest run|yc|exa|probe|roles|people|status`.
    status: built
    stage: stage:scrape
    serves: [constraint:free-tier, constraint:student-budget, guarantee:no-fabrication]
  - id: feature:hiring-post-provenance
    label: The hiring post on record — who posted it, where, and the link — on every company
    summary: |
      "Where did you get this?" answered with a name and a link. company.hiring_claim_by /
      hiring_claim_source / hiring_claim_at beside hiring_claim and hiring_claim_url; filled by
      HN (the poster's username), the YC directory, the company's own board, and X posts when
      they land. Shown on the Companies page. Backfilled 2026-09-03: 1,581 of 1,879 companies.
    status: built
    stage: stage:scrape
    serves: [guarantee:no-fabrication, feature:hiring-authenticity]
  - id: feature:x-public-post-reader
    label: X without a session — single posts read from the public embed endpoint; discovery via site:x.com web search
    summary: |
      Measured 2026-09-03: Exa does not index x.com (its tweet category is retired), Jina's
      search needs a paid key, the X API's search tier is ~$200/month. cdn.syndication.twimg.com
      /tweet-result and the guest-token GraphQL TweetResultByRestId return a single post's text,
      date and author with no login. Discovery stays keyless via DuckDuckGo `site:x.com` (fragile:
      bot-challenged on the second request) — `research x`. Search/timelines are login-gated; a
      throwaway session was supplied but the logged-in Playwright intercept is blocked by the
      Claude Code permission classifier, so it is unbuilt. Records only; claims for hiring_verify.
    status: partial
    stage: stage:scrape
    serves: [constraint:no-linkedin-automation, constraint:free-tier]
  - id: feature:atlas-market-map
    label: Atlas as a market map — industry-chain layers, market segments as nodes, chokepoints = companies ready to be asked
    summary: |
      Redrawn 2026-09-03 after Tejmul said the pipeline-bucket nodes ("Pay not stated yet: 1,550",
      "Python: 225") made no sense. jobhunter/segments.py files every company under one segment
      (Fintech & payments, LLM inference & AI infrastructure, Dev tools…) on five layers
      (infrastructure → AI models & tooling → developer tools → applications → services) from its
      own description and YC industries — rules, first match wins, verticals before generic words,
      no model, "Unclassified" shown as such. network.build() sizes nodes by fitting companies and
      marks a CHOKEPOINT where at least one company is a *bet* (hiring proven on its own site + a
      fresher role + remote-from-anywhere or India + a lead with a usable email) and a BOTTLENECK
      where near-bets lack only a lead or the hiring check. Links = a company's secondary segments.
      Click a node → its companies, bets first, each saying what it is missing.
    status: built
    stage: stage:platform
    serves: [constraint:send-cap-25, guarantee:no-fabrication]
    replaces: [feature:atlas-funnel]
  - id: feature:remote-anywhere-signal
    label: job.remote_anywhere — the posting itself says "work from anywhere / no visa"; companies with it rank first
    summary: |
      MOTIV §2 only pays at companies that hire across borders without sponsorship. normalize.
      remote_anywhere() reads the posting's own words (work from anywhere, remote — worldwide,
      timezone-agnostic, no visa sponsorship required…); the Companies page and the atlas put those
      companies first; Exa discovery queries target the phrasing. Senior roles are kept but flagged
      (job.is_senior) — freshers only, senior never chased (search.exclude_senior stays off).
    status: built
    stage: stage:filter
    serves: [problem:pay-gap-geographic]
  - id: feature:pay-basis-from-funding
    label: How we decide a company can pay a fresher ₹30 L+ when nothing is stated — funding as the proxy, labelled as an estimate
    summary: |
      Tejmul, 2026-09-03: "based on valuation we decide." Order of evidence: (1) pay stated in a
      posting; (2) the company's own site / About page and press, read for funding, valuation,
      team and the origin story (one `cheap` call, every field with its quoted words, dropped
      without them); (3) the estimate — targeting.funding_pay_basis(): US/UK/EU HQ with seed ≥ $3M
      or Series A+ inside 30 months → funding-strong ("able to pay a $40k remote engineer without
      noticing"); a YC batch inside 30 months with a team ≥ 10 → funding-strong (a seed company
      that hired ten people has raised past the batch cheque); pre-seed / < $2M / stale → weak;
      India never lifts above weak without a stated figure (rupee pay does not follow dollar
      rounds). company.pay_basis + pay_basis_evidence are shown on the page under "Can they pay a
      fresher ₹30 L+?" and never as a figure the company stated. Glassdoor is not scraped (login
      wall, ToS); the model's memory is never a source for a number.
    status: built
    stage: stage:filter
    serves: [guarantee:no-fabrication, problem:pay-gap-geographic]
  - id: feature:pay-power-benchmark
    label: PAY POWER — the visible 0–100 benchmark for "how easily can this company pay a fresher ₹30–40 L"
    summary: |
      Tejmul, 2026-09-03: "create a benchmark like valuation capitalisation and keep it visible."
      targeting.pay_power(): pays 100 (a posting states ≥ ₹30 L) · deep pockets 85 ($10M+ inside
      24 months, or Series A+ inside 30 months, or valuation ≥ $50M) · funded 65 ($3–10M inside 30
      months, or YC batch inside 30 months with team ≥ 10) · thin 30 · unknown 0. India never above
      thin without a stated number. Money per head (raised ÷ team) shown beside it. Thresholds in
      config.yaml targeting.pay_power; the bands are printed on the Companies page and on every
      company page next to the score and the sentence that decided it. A later round no longer
      rejects a company (Revenuecat: Series C → deep pockets 85, prospect); "underrated" is now
      hype + team ≤ 200 only. First grade: pays 243 · deep 6 · funded 103 · thin 410 · unknown 1,233.
      Parser fixes the same day: "401(k)" was read as a $401k salary (34 jobs, 7 companies), a
      homepage "$100,000" as a $100,000M round (3 companies) — both cleaned and guarded.
    status: built
    stage: stage:filter
    serves: [guarantee:no-fabrication, problem:pay-gap-geographic]
    replaces: [feature:pay-basis-from-funding]
  - id: feature:company-story
    label: company.story / valuation / team_size — the backstory read from their own words (About page, YC long description)
    summary: |
      Sanus-style diligence for every company: where it started, who, what since; valuation only
      when a source states it; team size. YC long descriptions give 1,251 stories for free;
      enrich.py's own-site pass (no Exa) reads home + About for the rest. Shown on the company
      page as "The story" with the URL it was read from.
    status: built
    stage: stage:research
    serves: [guarantee:no-fabrication]
  - id: feature:review-gate-flags
    label: The review gate — every draft carries the facts it was allowed to use and the flags a reviewer must read
    summary: |
      outreach/gates.py: faithfulness (proper nouns and numbers must appear in the profile, the
      person's own evidence or the company's own pages — unsupported ones are listed), AI-tell
      vocabulary, length band, one ask, dashes, guessed address. Stored on Email.review_flags and
      Email.evidence, shown in the Queue above the editor; drafts expire after 7 days. The gate
      never rewrites — it flags, the human decides. Drafts now use the company's own facts
      (description, origin, hiring proof, the hiring post, the role) and the lead's evidence.
    status: built
    stage: stage:review
    serves: [guarantee:no-fabrication, constraint:human-review]
  - id: feature:send-ledger-dryrun
    label: Send ledger locked inside the send, guessed-address cap, and a dry-run mode that runs the whole loop into outbox/
    summary: |
      outreach/ledger.py: one row per candidate per day, BEGIN IMMEDIATE, the slot is taken before
      the mail leaves and given back on failure; pattern-guessed addresses have their own cap of 5.
      outreach.send_mode dryrun|gmail — dry-run writes .eml files to outbox/ and marks threads
      dryrun:<id> (never polled), so drafts → approval → send → reply → calendar can be rehearsed
      before the Gmail OAuth client exists. Rehearsed end to end on 2026-09-03.
    status: built
    stage: stage:send
    serves: [constraint:send-cap-25, constraint:human-review]
  - id: feature:reply-to-calendar
    label: A yes with a time becomes an Event — model + regex extraction, conflicts, reschedule draft, Google Calendar push
    summary: |
      outreach/schedule.py: a positive reply is read for intent (call / assessment / interview /
      referral made), proposed times (model with today's date injected; plain regex "Thursday 4pm
      IST" when the model is down), link, deadline, and the sentence it came from. Event rows;
      two events within 45 minutes are a conflict and the reschedule email is drafted into the
      Queue (never sent by the machine, never names the other company). outreach/calendar.py
      pushes confirmed events with the same OAuth client as Gmail (calendar.events scope added).
      Calendar page in the dashboard. Replies can also be recorded by hand (record-reply).
    status: built
    stage: stage:schedule
    serves: [problem:a-yes-must-not-get-lost]
  - id: feature:learn-report
    label: LEARN — reply and yes rates by who we asked, Pay Power, segment, region, source, role level, remote, length, week
    summary: |
      outreach/learn.py, derived from Email/Reply/Contact/Company/Job rows, nothing stored;
      /api/learn and the "What works" section on the Tracker page, with a plain reading of the
      numbers. The first 100 sends are the calibration set.
    status: built
    stage: stage:track
    serves: [problem:learn-the-funnel]
  - id: feature:forked-org-guard
    label: Commit history in an org full of other companies' engineers is not employment evidence — those committers are not leads
    summary: |
      network._reachable: when ≥30% of a company's corporate-domain committers are on another
      company's domain (Affirm's forked Flink repos; 173 orgs measured on 2026-09-03), freemail
      committers from that org are held back unless their own GitHub profile names the company
      (Contact.employer_claim, stored from the profile's company field from now on).
    status: built
    stage: stage:contacts
    serves: [guarantee:no-fabrication]
  - id: feature:referral-role-classes
    label: Who can actually refer us — role classes and ranks
    summary: >
      Founder (1) · senior/staff/founding engineer (2) · SDE 1-3 and AI/ML engineer (3) ·
      engineering manager (4) · technical HR / technical recruiter (5) · general HR (6) ·
      everyone else (9). Keyword rules first with the matched text kept as evidence, the
      residue optionally to the `cheap` OpenRouter alias, a shared mailbox (careers@, hr@)
      read as a role in itself. No alumni/college targeting — that network is already known
      personally. Ties break on a verified address over a guessed one.
    status: built
    stage: stage:contacts
    implemented_in: [module:jobhunter.contacts.roles]
  - id: feature:company-knowledge-in-graph
    label: Every company in the graph with what it does, its stipend and its PPO
    summary: >
      Company nodes carry description, tier and the reason for it, region, stipend and PPO
      with their evidence sentences, funding stage/amount/investors, and the hiring verdict
      with the quote behind it. tier: and region: nodes make "every tier1 company in Germany"
      a traversal rather than a scan; contacts link to role: nodes by class.
    status: built
    stage: stage:platform
    implemented_in: [module:jobhunter.kg, module:jobhunter.enrich]
  - id: feature:graph-as-decision-surface
    label: The graph answers the questions, it does not just mirror the tables
    summary: >
      `kg why <company>` assembles the whole decision by traversal — what they do,
      funding and investors, tier and why, whether their own careers page backs the
      hiring, which open roles ask for skills we have, who can refer us, and whether we
      are allowed to write to them — ending in one verdict: write / wait / verify / skip.
      `kg shortlist` ranks targets on all of it at once; `kg guard` answers MOTIV §6's
      cooldown from the email edges; `kg expand` walks company → investor → company.
    status: built
    stage: stage:platform
    implemented_in: [module:jobhunter.kg.hunt]
  - id: feature:job-skill-edges
    label: job -REQUIRES-> skill, the free explainable half of matching
    summary: >
      Skill nodes previously linked only to profile:me, which made them labels rather
      than a graph. Every job is now matched against the profile's skills in one pass and
      linked — 3,068 edges over 1,237 jobs — so profile:me -HAS_SKILL-> skill <-REQUIRES-
      job is a path. "Which of their roles want what I have" and "which of my skills does
      no target job ask for" are both traversals, at zero model cost.
    status: built
    stage: stage:score
    implemented_in: [module:jobhunter.kg]
  - id: feature:employment-evidence
    label: An address on another company's domain is evidence AGAINST employment
    summary: >
      Every WORKS_AT edge carries confirmed / unproven / contradicted with the reason.
      Found by it on the real data: Affirm's GitHub org carries forked Apache Flink
      repositories, so commit mining filed twenty Flink committers on @confluent.io as
      Affirm employees — 13 of the 25 stored contacts are contradicted. The verdict in
      `kg why` refuses to recommend a contradicted contact and states "employment
      unproven" when the address is personal, so a draft can never claim what we cannot
      show. This is MOTIV §6 "nothing is invented" enforced structurally rather than by
      prompt.
    status: built
    stage: stage:contacts
