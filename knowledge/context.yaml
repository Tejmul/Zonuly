    summary: Stack overlap, YOE barrier, early-career signal, domain proximity, company stage. A Staff role scores low on perfect overlap; a Series-A founding role scores high on imperfect overlap. Hand-verified on Notion 75 / Deepgram 65 / Observe.AI 35 / Databricks 15.
