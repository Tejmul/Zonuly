  # ---- send
  - id: feature:send-cap-count
    label: Daily cap as a count — sent rows since local midnight
    summary: Nearly right. The decrement isn't in the same transaction as the Gmail call, so a crash between send and DB write loses a send from the count.
    status: built
    stage: stage:send
    proposed_by: [arch:plan]
    serves: [constraint:send-cap-25, guarantee:budget-spent-well]
    implemented_in: [module:jobhunter.outreach]
  - id: feature:send-budget-ledger
    label: send_budget(date, cap, used) row, locked and decremented inside the send transaction
    summary: Both ARCHITECTURE (unique (date, slot)) and ORCHESTRATION specify it. Do this before the first real send — the failure it prevents damages the Gmail account.
    status: gap
    stage: stage:send
    proposed_by: [arch:architecture, arch:orchestration]
    serves: [constraint:send-cap-25, guarantee:budget-spent-well]
    replaces: [feature:send-cap-count]
  - id: feature:guessed-send-cap-5
    label: At most 5 of the 25 daily sends to pattern-guessed addresses
    summary: Bounces are the main way this system damages the account it depends on.
