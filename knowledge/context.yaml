# ------------------------------------------------------------------ decisions (FINAL-PLAN §3 + this session)
decisions:
  - id: decision:d22-underrated-only
    label: D22 — underrated companies only, hyped names rejected by name
    summary: >
      Tejmul, 2026-09-03: "Don't target companies which every person would know." The hyped
      list is config, not code, and runs before every other rule. Consequence — well-known
      but not-listed companies (Vercel, Ramp, Scale AI) still pass on name alone; the funding
      ceiling ($400M) is what is meant to catch them, and it needs funding data to do so.
    adopts: [feature:underrated-only]
  - id: decision:d23-stipend-predicts-ppo
    label: D23 — the ₹50k/month stipend is a hard bar because it predicts the PPO
    summary: >
      Tejmul, 2026-09-03: "If the company is not giving more than 50, I don't think that
      company will give more than 24 or 30 plus." So the stipend is not a perk to weigh, it
      is a gate to fail. Internships stop being excluded by title as a consequence.
    adopts: [feature:stipend-bar-50k]
  - id: decision:d24-tier2-is-24-to-30
    label: D24 — tier1 ≥ ₹30 LPA, tier2 ₹24–30 LPA, reject below
    summary: >
      "Category two" companies are kept and queued behind tier1, never dropped. Below ₹24 LPA
      the company stays in the database but is never queued.
    adopts: [feature:company-tiers]
  - id: decision:d25-silence-is-not-a-no
    label: D25 — no stated PPO is not a rejection; engineers + verified hiring make it a prospect
    summary: >
      Tejmul, 2026-09-03: "Most job posts don't say there is a PPO available. Once you see
      software engineers over there and they're hiring actively, you can also add that company."
      Hence the `prospect` tier, which depends on the hiring verifier having run.
    adopts: [feature:company-tiers, feature:hiring-authenticity]
  - id: decision:d26-no-alumni-targeting
    label: D26 — no NST/alumni targeting
    summary: >
      Tejmul, 2026-09-03: the first NST batch is small and already known personally, so a
      machine adds nothing. The people layer targets roles, not schools, and looks globally.
    adopts: [feature:referral-role-classes]
    rejects: []
  - id: decision:d1-python
    label: D1 — Python, not TypeScript
    summary: The value of the system sits in the scraping, PDF and email ecosystem, which is Python's. The frontend stays Next.js over REST. Consequence — the portal's layering lint doesn't port; the rule holds by convention.
    adopts: [feature:python-pipeline-nextjs-ui]
    rejects: [feature:typescript-drizzle-stack]
    recorded_in: arch:final
  - id: decision:d2-model-size
    label: D2 — (reversed by D18) qwen3:4b, the size the machine can actually hold
    summary: REVERSED 2026-08-31 — Ollama wrecks the machine; see D18. Every draft assumed 14B and 16 GB; the machine has 8. 4B ranks correctly on real postings (verified by hand); calibration against real screens is still unmeasured. Fixed num_ctx + keep_alive 30m are load-bearing.
    adopts: [feature:local-model-qwen3-4b]
    rejects: [feature:local-model-14b-tiered]
    recorded_in: arch:final
  - id: decision:d3-no-hosted-model
    label: D3 — (reversed by D18) No hosted model; local wins
    summary: REVERSED 2026-08-31 — OpenRouter is the only provider; see D18. TOOLS budgeted Claude for drafts; ORCHESTRATION said "there is no LLM API key, and that is the point." Local wins — it was the original constraint, the review queue catches weak prose, and llm.py is a one-line seam. Pull that seam first if reply rates are bad.
    adopts: [feature:local-llm-drafting, feature:single-llm-client-seam]
    rejects: [feature:hosted-claude-drafting]
    recorded_in: arch:final
  - id: decision:d4-deterministic-orchestrator
    label: D4 — The orchestrator is code; there are no supervisor agents
    summary: Every supervisor decision is a ten-line policy with a config value. What survived — the state machine, narrow workers, typed contracts, depth cap, fault isolation. What was dropped — envelopes, capability narrowing, the run tree.
    adopts: [feature:deterministic-orchestrator, feature:sequential-typed-handoffs, feature:fault-isolated-sources]
    rejects: [feature:llm-supervisor-hierarchy, feature:circuit-breaker-source-health, feature:immutable-artifacts-content-hash]
    recorded_in: arch:final
  - id: decision:d5-github-spike
    label: D5 — The GitHub email spike came back good, bimodally
    summary: Supabase 12/12, Affirm 20/20, GitLab 5/5, Observe.AI 0 (no org). Person-event mining yields nothing (GitHub removed commit detail from PushEvent); the repo commits endpoint still carries author emails. Infra/devtools companies are cheap to contact; companies without public code should be skipped, not guessed at.
    adopts: [feature:github-commit-mining, feature:skip-company-not-guess]
    recorded_in: arch:final
  - id: decision:d6-free-tier
    label: D6 — Free tier only; no paid finders or verification credits
    summary: The waterfall can take paid tiers but free tiers are doing the work. Hunter's 25/mo is reserved for learning a company's pattern. Revisit if verified rate drops below ~20%.
    adopts: [feature:hunter-free-tier-for-patterns, feature:email-pattern-inference]
    rejects: [feature:paid-email-finders-verification]
    recorded_in: arch:final
  - id: decision:d7-smtp-off
    label: D7 — SMTP RCPT probing is off; TOOLS.md was right
    summary: Built on by default, which was wrong. Port 25 is blocked residentially, big providers accept every recipient at the edge, and probing risks an IP listing. MX lookup stays.
    adopts: [feature:mx-check-only]
    rejects: [feature:smtp-rcpt-probe]
    recorded_in: arch:final
  - id: decision:d8-three-tiers
    label: D8 — Three confidence tiers, never collapsed
    summary: verified / pattern-guessed / scraped, named for what the user needs to distinguish. Shown everywhere, never defaulted.
    adopts: [feature:three-confidence-tiers]
    recorded_in: arch:final
  - id: decision:d9-no-sqlite-vec
    label: D9 — SQLite, one file, no vector extension
    summary: Plain-Python cosine over cached vectors is sub-second at 1,100 postings. Revisit past ~50k.
    adopts: [feature:sqlite-single-file, feature:resume-vector-cache]
    rejects: [feature:sqlite-vec]
    recorded_in: arch:final
  - id: decision:d10-kg-in-sqlite
    label: D10 — The knowledge graph lives in SQLite with NetworkX on top, not in a graph database
    summary: Same logic as D9 — Neo4j needs a daemon, Kùzu was archived in late 2025, LLM-memory frameworks want a server-class backend. Two tables and an FTS5 index in jobhunter.db keep it in the one file that's backed up; NetworkX gives centrality, paths and GraphML export in memory.
    adopts: [feature:knowledge-graph-context]
  - id: decision:d11-sqlite-not-csv
    label: D11 — SQLite stays; CSV is an interface, not the store
    summary: The restated problem asked for CSV and no database. A CSV cannot hold dedup keys, scores, contacted-when, budgets or reply state. Export and import CSVs exist for the two of us; the state stays in jobhunter.db.
    adopts: [feature:csv-import-export]
    rejects: [feature:csv-as-the-store]
    recorded_in: arch:plan-v2
  - id: decision:d12-linkedin-no-cookies-only
    label: D12 — LinkedIn data comes from public no-cookies channels or not at all
    summary: Free path first (GitHub commits, site, pattern). Where that yields nothing at a graded company, an Apify no-cookies employee harvest at ~$0.15/company behind a $0.50/day gate. Our own LinkedIn is used by hand for the alumni filter and never automated.
    adopts: [feature:apify-employee-harvest, feature:apify-cache-ledger]
    recorded_in: arch:plan-v2
  - id: decision:d13-agents-are-workers
    label: D13 — "Multi-agent" means narrow LLM workers under a deterministic conductor
    summary: Salary extractor, fit judge, role classifier, researcher, drafter, reply classifier, schedule extractor, follow-up drafter. Each has a typed input and output and a budget; none calls another; none can send; deterministic code decides what runs. D4 restated with a roster.
    adopts: [feature:role-classifier, feature:reply-intent-extraction, feature:deterministic-orchestrator]
    recorded_in: arch:plan-v2
  - id: decision:d14-regions-and-feasibility
    label: D14 — Target regions and pay are config; the scorer knows about visa feasibility
    summary: search.regions with per-region floors; a fifth rubric dimension for remote-from-India / sponsorship / new-grad visa realism; a hard cap on US on-site with no sponsorship statement.
    adopts: [feature:region-currency-targeting, feature:location-feasibility-score]
    recorded_in: arch:plan-v2
  - id: decision:d15-two-candidates
    label: D15 — Two candidates, one pipeline, one of us per contact per month
    summary: Per-candidate scores, drafts, sends, budgets and Gmail; shared companies, jobs and contacts; the cooldown is enforced in the drafter.
    adopts: [feature:multi-candidate, feature:cross-candidate-cooldown]
    recorded_in: arch:plan-v2
  - id: decision:d16-openrouter-writing-tier
    label: D16 — OpenRouter for the writing tasks, local for everything else, both behind the permission gate
    summary: Revises D3. Drafts, follow-ups and the approval assistant may run on a cheap hosted model via one OpenRouter key (≤ 80 calls/day, ≤ ₹400/month); scoring, embeddings, research and reply classification stay local; any failure or a missing key falls back to local. Disabled until enabled in permissions.yaml.
    adopts: [feature:openrouter-task-routing, feature:approval-assistant]
    rejects: [feature:hosted-claude-drafting]
    recorded_in: arch:plan-v2
  - id: decision:d17-approval-first
    label: D17 — Nothing runs or gets built without permission
    summary: The permission gate is build step 0 and every later step is gated by it; the build itself proceeds one approved step at a time with a note after each.
    adopts: [feature:permission-gate, feature:action-log, feature:build-approval-protocol]
    recorded_in: arch:plan-v2
  - id: decision:d18-no-local-model
    label: D18 — No Ollama, no local model; OpenRouter is the only model provider
    summary: Reverses D2 and D3. Ollama has wrecked the machine every time. Aliases cheap / judge / writer over one key, num_retries 0, a cost row per call, daily and monthly caps in permissions.yaml, the lexical fit gate at the wide end of the funnel so the model only reads plausible jobs.
    adopts: [feature:openrouter-model-layer, feature:lexical-fit-prefilter, feature:cheap-triage-agent]
    rejects: [feature:local-model-qwen3-4b, feature:local-llm-drafting, feature:embedding-prefilter-percentile, feature:resume-vector-cache]
    recorded_in: arch:plan-v3
  - id: decision:d19-agents-propose-runtime-enforces
    label: D19 — Agents are pydantic-ai workers that can only propose; capabilities and budgets are enforced by the runtime, not the prompt
    summary: gtm-arch's agent runtime and proposal path, MULTI-AGENT's depth cap and envelopes, without Temporal. Every write is a fact_proposal or draft_proposal; every run is a ledger row; EXECUTE_OUTREACH is held by nobody.
    adopts: [feature:agent-runtime-capabilities, feature:proposal-tables, feature:durable-run-ledger, feature:budgets-py, feature:immutable-artifacts-v3, feature:faithfulness-and-publish-gate]
    rejects: [feature:llm-supervisor-hierarchy]
    recorded_in: arch:plan-v3
  - id: decision:d20-three-channel-scraping
    label: D20 — Three scraping channels behind one politeness core, one staging area, one audit gate, driven by a launchd tick
    summary: CHOKEPOINTS' engine shape — keyless channel at the documented rate 24/7, Apify no-cookies channel behind a budget, Brave research channel returning only cited facts — replaces per-scraper clients and APScheduler.
    adopts: [feature:politeness-core, feature:staging-audit-promote, feature:tick-conductor, feature:research-rig-cited, feature:apify-client-v3, feature:morning-report, feature:kill-hardened-stages]
    rejects: [feature:circuit-breaker-source-health]
    recorded_in: arch:plan-v3
  - id: decision:d21-telegram-review
    label: D21 — Telegram is the second review surface, with the atomic-claim pattern
    summary: zon-arch's Slack cards for two people on a free bot. Decisions are recorded by Telegram and acted on only by the API's approval handler.
    adopts: [feature:telegram-review-surface]
    recorded_in: arch:plan-v3

# ------------------------------------------------------------------ gaps, in build order (FINAL-PLAN §10–11)
gaps:
  - id: gap:contact-employment-false-positives
    label: Commit mining files non-employees as employees — 13 of 25 contacts are contradicted
    summary: >
      github_miner walks an org's repositories, but a fork carries the upstream project's
      committers: Affirm's forked Apache Flink repos produced twenty @confluent.io people
      filed as Affirm staff, and GitLab's produced three more on personal domains. The
      graph now labels these `contradicted` and refuses to recommend them, which stops the
      false claim — but the miner still creates them. It should skip forked repositories,
      weight commits by recency and count, and prefer people whose address is on the
      company domain.
    builds: [feature:employment-evidence]
  - id: gap:investor-edges-have-no-data
    label: company -FUNDED_BY-> investor is built but 0 edges exist
    summary: >
      `kg expand` walks company → investor → company to grow the registry with companies
      that are underrated by construction. The sync writes the edges, but no company has
      investor data yet: enrichment reads only the company's own site, which rarely states
      a funding round in a sentence the extractor accepts. Blocked on the same thing as
      gap:funding-data-for-underrated — a search backend or the funding RSS feeds.
    builds: [feature:graph-as-decision-surface]
  - id: gap:internship-source
    label: No enabled source carries internship postings, so the stipend bar never binds
    summary: >
      Greenhouse, Lever, Ashby, HN, RemoteOK, WeWorkRemotely and YC are full-time and
      remote-senior heavy. A 601-posting scrape on 2026-09-03 produced zero internships and
      zero stipend figures across 1,237 stored jobs — the four "intern" title matches are
      "Internal" and "International". The ₹50k bar and the PPO extraction are built, unit-proved
      on fixtures and wired into scrape and grading, but no real row exercises them until a
      source that carries internships is enabled (Instahyre/Cutshort are Playwright-based and off;
      Internshala and Wellfound are unbuilt).
    builds: [feature:stipend-bar-50k]
  - id: gap:funding-data-for-underrated
    label: The $400M funding ceiling has no funding data to work with
    summary: >
      Without a web-search backend (no EXA_API_KEY, no mcporter) enrichment reads only the
      company's own site, where funding is rarely stated in a sentence the extractor will
      accept. So well-known-but-unlisted companies still grade tier1 on name alone. Needs
      either the funding RSS feeds (feature:funding-feed-registry) or a search backend.
    builds: [feature:underrated-only]
  - id: gap:16-permission-gate
    label: V3 #0 — Permission gate + ledgers (permissions.yaml, budgets.py, approval_request, action_log, agent_run, costs)
    priority: 0
    summary: Everything later is gated by it. Wrap Hunter and send_email first.
    builds: [feature:permission-gate, feature:action-log, feature:durable-run-ledger, feature:budgets-py]
    protects: [guarantee:human-gate, guarantee:budget-spent-well]
  - id: gap:18-model-layer
    label: V3 #1 — OpenRouter model layer + pydantic-ai runtime + capabilities; remove Ollama
    priority: 0.5
    summary: Makes the machine safe to run on. openrouter.py with aliases and a cost row per call; llm.py deleted; grep -ri ollama returns 0.
    builds: [feature:openrouter-model-layer, feature:agent-runtime-capabilities, feature:ci-guardrails]
    protects: [guarantee:budget-spent-well]
  - id: gap:19-scoring-v3
    label: V3 #2 — Lexical fit → triage → judge with the feasibility dimension; job_score per candidate; rescore
    priority: 0.7
    summary: The cost gradient with no model at the wide end.
    builds: [feature:lexical-fit-prefilter, feature:cheap-triage-agent, feature:location-feasibility-score, feature:region-currency-targeting]
  - id: gap:20-proposals-gates
    label: V3 #5 — artifact, fact_proposal, draft_proposal, thresholds, faithfulness + publish gates, reviewer agent
    priority: 4.5
    summary: Every agent write becomes a proposal; drafts carry claims with spans; unsupported specifics are stripped.
    builds: [feature:proposal-tables, feature:immutable-artifacts-v3, feature:faithfulness-and-publish-gate, feature:approval-assistant, feature:humanisation-lint]
    protects: [guarantee:no-fabrication, guarantee:human-gate]
  - id: gap:21-telegram
    label: V3 #6 — Telegram review surface + morning report
    priority: 4.7
    summary: Approve from the phone; a double tap yields one send.
    builds: [feature:telegram-review-surface, feature:morning-report]
  - id: gap:22-scraping-engine
    label: V3 #7 — fetch.py politeness core, tick.py + launchd, source_health, staging/audit/promote, funding RSS; remove APScheduler
    priority: 5.5
    summary: The CHOKEPOINTS engine shape.
    builds: [feature:politeness-core, feature:tick-conductor, feature:staging-audit-promote, feature:funding-feed-registry, feature:kill-hardened-stages]
  - id: gap:23-people-v3
    label: V3 #8 — apify.py pin registry, employee harvest, role classifier, referral ranking, Brave research rig
    priority: 6.5
    summary: Three channels for people; only cited observations reach the drafter.
    builds: [feature:apify-client-v3, feature:apify-employee-harvest, feature:role-classifier, feature:referral-ability-ranking, feature:research-rig-cited, feature:untrusted-content-wrapper]
  - id: gap:0-gmail-e2e
    label: Gmail OAuth credentials + end-to-end dry run to a second inbox
    priority: 1
    summary: The only untested path. Everything downstream is theory until one email sends, gets replied to, and classifies correctly.
    builds: [feature:gmail-api-own-account, feature:reply-classification, feature:single-followup]
  - id: gap:1-send-ledger
    label: GAP-1 — Send budget should be a ledger, not a count
    priority: 2
    summary: A crash between the Gmail call and the DB write loses a send from the count. Small change; the failure it prevents damages the Gmail account. Do it before the first real send.
    builds: [feature:send-budget-ledger]
    protects: [guarantee:budget-spent-well]
  - id: gap:4-guessed-cap-expiry
    label: GAP-4 — guessed-send cap and draft expiry
    priority: 3
    summary: At most 5 of 25 to unverified addresses; drafts expire at 7 days. Two small checks, both protect the account.
    builds: [feature:guessed-send-cap-5, feature:draft-expiry-7d]
    protects: [guarantee:confidence-labels, guarantee:budget-spent-well]
  - id: gap:2-fabrication-check
    label: GAP-2 — Anti-fabrication is a prompt, not a check
    priority: 4
    summary: Highest-value correctness gap. Extract proper nouns and numbers from the draft, check each against the researcher's input, flag mismatches in the review UI. Before volume — one invented claim is worse than fifty generic emails.
    builds: [feature:fabrication-validator-cheap]
    protects: [guarantee:no-fabrication]
  - id: gap:6-tests-lint
    label: GAP-6 — No tests, no layering lint
    priority: 5
    summary: Salary parsing against a fixture table, scraper parsing against recorded JSON, ~20 hand-labelled scoring fixtures. Cheapest insurance on the two subtlest pieces of logic.
    builds: [feature:tests-fixtures, feature:scoring-fixtures-calibration, feature:layering-lint]
  - id: gap:3-warmth-tiers
    label: GAP-3 — Warmth tiers + alumni CSV
    priority: 6
    summary: The biggest conversion lever, deliberately after correctness. A message to a fellow Newton School alum converts differently to a cold one.
    builds: [feature:warmth-tiers, feature:manual-linkedin-alumni-csv]
    protects: [guarantee:budget-spent-well]
  - id: gap:7-calibration
    label: GAP-7 — Calibration is unmeasured
    priority: 7
    summary: Needs an outcomes table and the discipline to record what happened. Only meaningful after a month of real replies.
    builds: [feature:outcomes-table-calibration, feature:rubric-version-on-scores]
  - id: gap:5-playwright
    label: GAP-5 — Playwright scrapers, or the manual registry route
    priority: 8
    summary: Last, or never. Browsing the Indian boards by hand and pasting company names is cheaper and safer.
    builds: [feature:manual-registry-route, feature:playwright-india-boards]
  - id: gap:8-freshness-alarm
    label: Source freshness alarm
    priority: 9
    summary: A source returning 0 twice running should be reported as a failure, not a quiet day. per_source is recorded; nothing reads it.
    builds: [feature:source-freshness-alarm]
  - id: gap:11-two-candidates
    label: V2 #6 — Two candidates with a cross-candidate cooldown
    priority: 12
    summary: Three evenings. Doubles the ceiling without doubling the spam.
    builds: [feature:multi-candidate, feature:cross-candidate-cooldown]
  - id: gap:13-calendar
    label: V2 #8 — Replies → events → calendar + notifications
    priority: 14
    summary: Four evenings. The genuinely new subsystem; the thing that makes a "yes" not get lost.
    builds: [feature:reply-intent-extraction, feature:calendar-events, feature:conflict-reschedule-draft]
    protects: [guarantee:human-gate]
  - id: gap:15-apify-harvest
    label: V2 #10 — Apify no-cookies employee harvest, budget-gated
    priority: 16
    summary: Two evenings, ≤ ₹1,000/month. People at companies with no public code. Measure verified-email yield after pattern inference before keeping it.
    builds: [feature:apify-employee-harvest, feature:apify-cache-ledger, feature:untrusted-content-wrapper]

# ------------------------------------------------------------------ failure modes (FINAL-PLAN §12)
failure_modes:
  - id: failure:source-breaks-silently
    label: A source breaks silently
    likelihood: 1
    summary: Board changes shape, scraper returns 0, nothing errors. Signal — one source's count drops to 0 while others are normal.
    mitigated_by: [feature:fault-isolated-sources, feature:source-freshness-alarm]
  - id: failure:human-stops-reviewing
    label: The human stops reviewing
    likelihood: 2
    summary: Queue depth grows, approvals go to zero. A backlog of unread drafts is pure waste.
    mitigated_by: [feature:draft-expiry-7d, feature:keyboard-driven-review]
  - id: failure:model-degrades-long-runs
    label: The local model degrades on long runs
    likelihood: 3
    summary: Ollama evicting/reloading under 8 GB pressure — a scoring pass suddenly takes minutes per job. Fixed by fixed num_ctx + keep_alive; re-check if a third model is ever added.
    mitigated_by: [feature:local-model-qwen3-4b, feature:single-llm-client-seam]
  - id: failure:bounces-damage-account
    label: Bounces damage the sending account
    likelihood: 4
    summary: Guessed addresses fail; Gmail notices the pattern.
    mitigated_by: [feature:guessed-send-cap-5, feature:three-confidence-tiers, feature:contact-ranker]
  - id: failure:drafts-read-as-templates
    label: Drafts read as templates
    likelihood: 5
    summary: Reply rate flat and low. If you find yourself approving without editing, that's the signal.
    mitigated_by: [feature:review-queue-human-gate, feature:voice-checker, feature:warmth-tiers]
  - id: failure:github-rate-limit
    label: GitHub rate limit stalls contact discovery
    likelihood: 6
    summary: 60/hr unauthenticated stalls after ~3 companies.
    mitigated_by: [feature:github-token-rate-limit]
  - id: failure:commit-mining-yields-nothing
    label: Commit mining yields nothing for companies without public code
    likelihood: 7
    summary: Expected, not a bug. Site scrape is the fallback; if both fail, skip rather than guess.
    mitigated_by: [feature:team-page-scrape, feature:skip-company-not-guess]

# ------------------------------------------------------------------ open questions (FINAL-PLAN §14 + orchestration §20)
open_questions:
  - id: question:q1-4b-good-enough
    label: Does 4B stay good enough as volume grows?
    summary: Ranking is right today. If reply rates are poor and drafts read stiff — better local model on a bigger machine first, then hosted model for drafting only.
    about: [decision:d2-model-size, decision:d3-no-hosted-model]
  - id: question:q2-review-ten-minutes
    label: Does review actually take ten minutes?
    summary: Unmeasured — there has been one draft. Measure before scaling to 25/day.
    about: [constraint:ten-minute-review, feature:review-queue-human-gate]
  - id: question:q3-warmth-vs-score
    label: Warmth or score as the primary sort?
    summary: TOOLS argues warmth. Untested because warmth isn't built.
    about: [feature:warmth-tiers]
  - id: question:q4-percentile-70
    label: Is the 70th-percentile prefilter the right number?
    summary: Keeps the top 30% (~330 of 1,100). Chosen from the similarity distribution, not from outcomes.
    about: [feature:embedding-prefilter-percentile]
  - id: question:q5-reply-different-address
    label: What happens when a company replies from a different address?
    summary: Thread matching by gmail_thread_id handles most of it; person-level identity across addresses is unsolved.
    about: [feature:reply-classification]
  - id: question:q6-apify-worth-it
    label: Is $0.15/company of Apify data worth more than the same evenings on warmth tiers?
    summary: Measure the verified-email rate of Apify-sourced contacts after pattern inference before deciding.
    about: [feature:apify-employee-harvest, feature:warmth-tiers]
  - id: question:q7-low-grade-sends
    label: Should low-grade (< 40) roles ever be auto-drafted?
    summary: The plan says no, MOTIV says "still send". Resolve after a month of outcomes.
    about: [feature:llm-rubric-scoring, decision:d14-regions-and-feasibility]

