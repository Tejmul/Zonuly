  - id: feature:background-task-registry
    label: API never runs long work inline — task_id + polling
    summary: Scrape, score, discovery and send dispatch to a thread; the dashboard polls /api/tasks/{id}. Copied wholesale from the portal; why the UI never blocks on a 20-second model call.
