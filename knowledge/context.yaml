  - id: feature:deterministic-orchestrator
    label: Deterministic orchestrator — APScheduler + per-item commits, no LLM supervisors
    summary: Every "supervisor decision" is a ten-line policy with a config value. A crash loses one item, not the run. Daily 08:00 cycle, hourly reply poll, sequential on 8 GB.
