# ZoNuLy knowledge graph — context layer (human-editable source of truth)
#
# Everything the code cannot say about itself lives here: which architecture draft
# proposed which feature, which decision adopted or dropped it, what is still a gap,
# what breaks first, what is still undecided. `python scripts/run.py kg build` loads it.
#
# Conventions
#   ids are kind:slug and must start with the section's kind (feature:, decision:, ...)
#   link keys become edges (see jobhunter/kg/context.py LINKS):
#     proposed_by  arch -PROPOSES-> this        serves        this -SERVES-> constraint|guarantee
#     stage        this -AT_STAGE-> stage       implemented_in this -IMPLEMENTED_IN-> module
#     adopts / rejects / defers                 decision -> feature
#     builds / protects                         gap -> feature / guarantee
#     mitigated_by                              failure -> feature
#     about                                     question|note -> anything
#   feature.status: built | partial | gap | open | dropped
#   Session notes are added with `kg note`, not here — but dated milestones can live below.

problem:
  id: problem:zonuly
  label: Get referred into ₹30 LPA+ roles at funded US/UK/DE (and Indian) startups, 25 honest emails a day each
  summary: >
    An engineer on site in the US/UK/Germany costs ₹1.5–2 crore a year; the same company can hire us
    remotely from India, or on a visa, for ₹20–50 lakh and not notice. Recently funded startups exploit
    that gap; the hyped names do not. We are two final-year students with real shipped AI/infra work
    and normal (not Codeforces) DSA. ZoNuLy finds those companies and roles, grades each against our
    resume, finds 10–30 real people per company and labels who can refer, writes one honest email each,
    stops for our approval, sends 25 a day, tracks replies, follows up once, and puts every "yes" on our
    calendar. Judgement only matters at "yes, send that to that person". Full statement: system docs/Motive /MOTIV.md.
  file: system docs/Motive /MOTIV.md
  subproblems:
    - slug: hidden-jobs
      label: You never see most of the good jobs
      summary: Funded startups post to their own careers page (an ATS) and wait; aggregators see the role after hundreds have applied.
    - slug: triage
      label: You can't tell which ones are worth your time
      summary: "\"AI Engineer\" spans eight-years-of-ML to founding-engineer-for-a-strong-student; only reading the JD against the resume tells you which. Grade decides order and effort, never whether we try."
    - slug: cold-applications
      label: Cold applications go nowhere
      summary: A portal submission is one of 800; a weak referral from an engineer moves you to a stack of ten.
    - slug: referrals-dont-scale
      label: Referrals don't scale by hand
      summary: Find a person, their role, their email, their work; write something non-templated; send; follow up; schedule — twenty minutes each, and we have coursework.
    - slug: geography-pay
      label: The pay gap is geographic and the target is funded startups abroad
      summary: US/UK/DE remote-from-India or on-visa at any well-paid local rate; India on-site only at ₹30 LPA+. Not Google/Microsoft/Amazon. Visa feasibility (DE > UK > US) must be scored, not assumed.
    - slug: people-and-roles
      label: Who can actually refer
      summary: 10–30 people per company, each classified SDE1/2/3, staff, EM, DevOps, founder/CTO, recruiter/HR. Engineers and EMs first, founders next, recruiters last.
    - slug: scheduling
      label: A "yes" must not get lost
      summary: Replies that send a Meet link, an assessment or an interview slot go on our calendar with a notification; two companies on one slot get a reschedule draft for approval.
    - slug: two-candidates
      label: Two of us, one pipeline
      summary: Per-candidate resumes, scores, drafts, Gmail accounts and send budgets; shared companies, jobs and contacts; never both of us to the same person in the same month.

# ------------------------------------------------------------------ architectures
architectures:
  - id: arch:idea
    label: IDEA.md — the problem, stated plainly
    file: system docs/IDEA.md
    date: "2026-08-01"
    summary: The narrative brief. Defines the funnel shape, the honest-score rule, the confidence labels, the 25/day ceiling and the hard non-goals. Every later draft agrees with it.
    stance: {role: problem statement}
  - id: arch:plan
    label: PLAN.md — the original build plan
    file: system docs/PLAN.md
    date: "2026-07-31"
    summary: Python 3.12 + SQLModel + FastAPI pipeline, Next.js dashboard, Qwen3-4B via Ollama on 8 GB, seven free sources, five build phases. This is the draft the code was actually built from.
    stance: {language: python, model: local qwen3:4b, orchestration: pipeline, budget: free}
  - id: arch:architecture
    label: JOBHUNTER-ARCHITECTURE.md — lessons from the MVRX portal
    file: system docs/JOBHUNTER-ARCHITECTURE.md
    date: "2026-08-01"
    summary: Next.js + Drizzle + a Node worker; copies the portal's layering lint, HITL state machine and background-only long work; fixes its silent failures, missing tests and missing cost column. Hosted Claude for drafts, a (date, slot) send ledger, a proper-noun fabrication validator.
    stance: {language: typescript, model: local + hosted claude for drafts, orchestration: queue table + worker, budget: small}
  - id: arch:tools
    label: JOBHUNTER-TOOLS.md — tools, services and relationship sourcing
    file: system docs/JOBHUNTER-TOOLS.md
    date: "2026-08-01"
    summary: The what-do-I-sign-up-for doc. Free ATS APIs, GitHub as the relationship graph, an email-finding waterfall with paid tiers, and the warmth ladder (alumni > shared OSS > same city > stack > content > cold > recruiter) — its single best idea.
    stance: {language: typescript, model: local + claude sonnet drafts, budget: "₹3–5k/mo", contacts: warmth-ranked}
  - id: arch:orchestration
    label: MULTI-AGENT-ORCHESTRATION.md — conductor, supervisors, workers
    file: system docs/MULTI-AGENT-ORCHESTRATION.md
    date: "2026-08-01"
    summary: A deterministic conductor over 5 LLM supervisors over 18 narrow workers with typed envelopes, borrowed from gtm-os. Contributes the ideas that survived — send budget as a ledger, evidence-bound drafting, immutable artifacts, no auto-reject, guessed-send cap, draft expiry, outcomes for calibration — and the hierarchy that did not.
    stance: {language: python, model: local three-tier, orchestration: conductor + supervisors + workers, budget: "₹0"}
  - id: arch:gemini
    label: GEMINI.md — sequential agents, guardrails, provenance
    file: system docs/GEMINI.md
    date: "2026-08-01"
    summary: Four single-purpose agents passing typed handoffs, two runtime guardrails (tool-loop limit 5, Pydantic validation with 2 retries), and a clickable Provenance Panel showing exactly which HN comment or git commit produced each lead.
    stance: {orchestration: sequential typed pipeline, ui: provenance panel}
  - id: arch:final
    label: FINAL-PLAN.md — the reconciliation
    file: system docs/FINAL-PLAN.md
    date: "2026-08-29"
    summary: Supersedes the three competing drafts. States nine decisions against code that is actually running, measured on the live database, and lists seven gaps in build order. When in doubt, this document wins.
    supersedes: [arch:architecture, arch:tools, arch:orchestration]
    stance: {language: python, model: local qwen3:4b, orchestration: deterministic pipeline, budget: "₹0"}
  - id: arch:chokepoints
    label: CHOKEPOINTS.md — a keyless scraper run at the source's rate limit
    file: system docs/CHOKEPOINTS.md
    date: "2026-08-30"
    summary: Rebuild manual for a PE deal-sourcing atlas. Transfers the scraping engine ideas — the rate budget as the governing constraint, hourly bounded ticks under launchd, staging + audit-gated promotion, freshness alarms, source-quality classification, cheap hosted models behind one CLI, and a table of bugs already paid for.
    stance: {domain: other, scraping: keyless + rate-budgeted, scheduling: launchd, models: cheap hosted}
  - id: arch:gtm
    label: gtm-arch.md — gtm-os, budget-gated paid scraping and a HITL agent fleet
    file: system docs/gtm-arch.md
    date: "2026-08-30"
    summary: Multi-tenant SaaS spec. Transfers the Apify no-cookies LinkedIn actors with pinned versions, per-call costs, a daily budget gate and a 24h cache; the untrusted-content wrapper; no-auto-reject; and the named-but-unheld send capability. Everything multi-tenant is not taken.
    stance: {domain: other, scraping: apify no-cookies + budget gate, orchestration: temporal + agents, tenancy: multi}
  - id: arch:zon
    label: zon-arch.md — the MVRX portal
    file: system docs/zon-arch.md
    date: "2026-08-30"
    summary: Agency portal rebuild spec. Transfers the calendar sync (syncToken, events table with attendees, meeting notifier), the Apify response cache keyed on actor + input hash with TTL, and the long-jobs-never-in-handlers rule. Slack-as-UI and the content tooling are not taken.
    stance: {domain: other, calendar: google sync + notifier, scraping: apify cached, ui: slack}
  - id: arch:plan-v2
    label: FINAL-PLAN-V2.md — the plan against the restated problem
    file: system docs/FINAL-PLAN-V2.md
    date: "2026-08-30"
    summary: Keeps D1–D10, adds D11–D15 — SQLite not CSV, LinkedIn only via no-cookies public channels, agents are workers not supervisors, regions/pay/visa feasibility in config and the rubric, two candidates with a cross-candidate cooldown. Five changes — targeting, people and roles, two candidates, replies → calendar, operations — with a twelve-step build order and a ≤ ₹1,400/month cost sheet.
    supersedes: [arch:final]
    stance: {language: python, model: local + optional cheap hosted, orchestration: deterministic conductor + narrow workers, budget: "₹0–1,400/mo"}
  - id: arch:plan-v3
    label: FINAL-PLAN-V3.md — built from gtm-arch, zon-arch and CHOKEPOINTS; no local model
    file: system docs/FINAL-PLAN-V3.md
    date: "2026-08-31"
    summary: Ollama removed entirely. OpenRouter-only model layer with aliases, num_retries 0, cost rows and budget gates; pydantic-ai agents with capabilities and budget triples that can only propose; fact and draft proposals with thresholds and no auto-reject; faithfulness and publish gates; three scraping channels (keyless politeness core, Apify no-cookies, Brave research) behind staging → audit → promote; launchd ticks; Telegram review cards with atomic claims; calendar syncToken flow; permission tiers; 13 numbered build steps.
    supersedes: [arch:plan-v2, arch:final]
    stance: {language: python, model: openrouter aliases only, orchestration: launchd tick conductor + pydantic-ai workers, review: dashboard + telegram, budget: "₹1,400–4,000/mo, capped by permissions.yaml"}

# ------------------------------------------------------------------ constraints (chosen, not derived)
constraints:
  - id: constraint:send-cap-25
    label: 25 emails a day, each irreversible
    order: 1
    summary: The real ceiling. A personal Gmail sending 200 lookalike messages gets flagged, and the flagged account is the one interviews arrive at. Every upstream decision is about spending 25 well.
  - id: constraint:human-review
    label: Nothing sends without a human reading it
    order: 2
    summary: The review queue is the only path to send. Chosen mode, not a default.
  - id: constraint:local-only
    label: (retired) Model runs on the laptop; no LLM API key
    order: 3
    summary: Retired 2026-08-31 by D18. Replaced by — no secret leaves the laptop, every outbound model call is logged, priced and capped. The resume and drafts do go to OpenRouter.
    retired: true
  - id: constraint:8gb-ram
    label: The machine has 8 GB of RAM and no model runtime
    order: 4
    summary: Ollama wrecked the machine every time. With no local model the pipeline is I/O-bound and 8 GB is plenty; the constraint now means no daemons and no local inference of any kind.
  - id: constraint:no-local-model
    label: No Ollama, no local model, ever
    order: 3.5
    summary: Every attempt to run Ollama locally broke the system. All model calls go through OpenRouter behind a ledger and caps; a CI grep fails on any ollama import.
  - id: constraint:free-tier
    label: Free tiers only for data APIs
    order: 5
    summary: No paid Apollo/SerpAPI/Findymail/MillionVerifier. Revisit only if verified-contact rate drops below ~20%.
  - id: constraint:no-linkedin-automation
    label: No logged-in LinkedIn automation, ever
    order: 6
    summary: A banned LinkedIn destroys the exact asset being built — the ability to be referred. LinkedIn is in no scraper module.
  - id: constraint:single-user-laptop
    label: One user, one machine, one SQLite file
    order: 7
    summary: No Postgres, no daemons, no cloud scheduler. Everything that exists because of multi-tenancy is out.
  - id: constraint:ten-minute-review
    label: Daily review must take ~10 minutes
    order: 8
    summary: If review takes forty minutes the system has failed at its only human step. Unmeasured so far.
  - id: constraint:context-continuity
    label: A new session must not start from scratch
    order: 9
    summary: Decisions, gaps and what-changed-when must be queryable, not re-derived from six documents every time. This is what the knowledge graph is for.
  - id: constraint:student-budget
    label: ₹0 recurring; at most ₹1,000–2,500/month if paid data raises who we reach
    order: 10
    summary: We are students. Every paid call sits behind a daily budget gate and a cache; the baseline must work at zero.
  - id: constraint:visa-reality
    label: Visa feasibility is scored, never assumed
    order: 11
    summary: US on-site for a new grad is an H-1B lottery; UK needs a sponsor licence; Germany's Blue Card is feasible with a degree and a €48k+ offer. Remote-from-India is the realistic first path abroad.
  - id: constraint:one-of-us-per-contact
    label: Never both of us to the same person in the same month
    order: 12
    summary: Two near-identical emails from two students at one college a week apart reads as spam and burns the company for both.
  - id: constraint:approval-first
    label: Nothing happens without permission — in the app and in building it
    order: 13
    summary: Every action has a tier (local read · free external read · spend · write to the world · forbidden). Spend and world-writes need a grant; anything without one creates a request and waits. Building follows the same rule — one proposed, approved step at a time (FINAL-PLAN-V2 §13–14).

# ------------------------------------------------------------------ guarantees (the product)
guarantees:
  - id: guarantee:human-gate
    label: Nothing sends without a human
    order: 1
    summary: sender.send_email() refuses any email whose status isn't approved; approval is only settable from the approve route; no scheduled job calls send.
    enforced_by: [module:jobhunter.outreach, feature:review-queue-human-gate]
  - id: guarantee:no-fabrication
    label: Nothing is invented
    order: 2
    summary: Never a project, number or shared connection that isn't in the source material. Currently prompt-level only — the mechanical check is GAP-2.
    enforced_by: [feature:person-research-honest-hook]
  - id: guarantee:budget-spent-well
    label: 25/day, irreversibly spent, visible everywhere
    order: 3
    summary: sent_today() counts sent rows since local midnight and gates every send. A count, not yet a ledger — GAP-1.
    enforced_by: [feature:send-cap-count]
  - id: guarantee:confidence-labels
    label: Every contact carries a confidence tier, never collapsed
    order: 4
    summary: verified | pattern-guessed | scraped, stated on every insert, shown as a badge everywhere, used to order sends.
    enforced_by: [feature:three-confidence-tiers, module:jobhunter.db]
  - id: guarantee:one-followup
    label: At most one follow-up per thread
    order: 5
    summary: Email.followup_sent is set when the follow-up is queued, not sent, so a second can't be created even if the first is never approved.
    enforced_by: [feature:single-followup]
  - id: guarantee:data-stays-local
    label: No secret leaves the laptop; every outbound call is logged, priced and capped
    order: 6
    summary: Revised 2026-08-31 (D18). The resume and drafts do go to OpenRouter; keys stay in the environment; only the four network adapters may call out; every paid call is a ledger row under a cap you set.
    enforced_by: [feature:openrouter-model-layer, feature:durable-run-ledger, feature:ci-guardrails]
  - id: guarantee:no-auto-apply
    label: No auto-apply, no contact-list building
    order: 7
    summary: There is no application-submission code path and no export path. One person, one role, one ask.
    related: [constraint:no-linkedin-automation, guarantee:human-gate]

# ------------------------------------------------------------------ pipeline stages
stages:
  - id: stage:platform
    label: Platform (cross-cutting)
    order: 0
    summary: Storage, model client, orchestration, API, tests — what every stage stands on.
    runs: [module:jobhunter.db, module:jobhunter.llm, module:jobhunter.scheduler, module:jobhunter.api, module:jobhunter.kg]
  - id: stage:scrape
    label: 1 · Scrape
    order: 1
    summary: 11,282 postings from 7 sources, free, parallel, each fault-isolated.
    runs: [module:jobhunter.scrapers, module:jobhunter.pipeline]
    then: stage:filter
  - id: stage:filter
    label: 2 · Filter + dedup
    order: 2
    summary: Title/location rules then company+title fingerprint across sources; 1,651 relevant → 1,100 stored.
    runs: [module:jobhunter.normalize, module:jobhunter.pipeline]
    then: stage:salary
  - id: stage:salary
    label: 3 · Salary
    order: 3
    summary: Regex first, LLM only on the residue; everything normalised to INR LPA.
    runs: [module:jobhunter.normalize]
    then: stage:embed
  - id: stage:embed
    label: 4 · Embed + prefilter
    order: 4
    summary: nomic-embed-text cosine vs the resume; keep the top 30% by percentile, ~330 survive.
    runs: [module:jobhunter.matcher]
    then: stage:score
  - id: stage:score
    label: 5 · Rubric score
    order: 5
    summary: qwen3:4b rubric, ~18 s each → screen odds 0–100 + reasons + gaps; hard rules cap the model; ≥65 is a high match.
    runs: [module:jobhunter.matcher]
    then: stage:contacts
  - id: stage:contacts
    label: 6 · Contacts
    order: 6
    summary: Per high-match company — GitHub commits → site scrape → learned pattern → Hunter (only if no pattern) → MX check.
    runs: [module:jobhunter.contacts]
    then: stage:research
  - id: stage:research
    label: 7 · Research
    order: 7
    summary: Their repos + bio → one honest hook, null if the material is thin.
    runs: [module:jobhunter.outreach]
    then: stage:draft
  - id: stage:draft
    label: 8 · Draft
    order: 8
    summary: 90–130 words, plain text, local model.
    runs: [module:jobhunter.outreach]
    then: stage:review
  - id: stage:review
    label: 9 · Review queue — the human gate
    order: 9
    summary: Edit · approve · reject. The only path to send; budget visible and depleting.
    runs: [module:dashboard, module:jobhunter.api]
    then: stage:send
  - id: stage:send
    label: 10 · Send
    order: 10
    summary: Gmail API, ≤25/day, 10:00–19:00, 45–210 s stagger, plain text.
    runs: [module:jobhunter.outreach]
    then: stage:track
  - id: stage:track
    label: 11 · Track replies
    order: 11
    summary: Poll threads → classify positive | negative | closed | neutral; ambiguous → neutral → human reads it.
    runs: [module:jobhunter.outreach]
    then: [stage:followup, stage:schedule]
  - id: stage:followup
    label: 12 · Follow up
    order: 12
    summary: Five days silent → exactly one follow-up → back to the review queue.
    runs: [module:jobhunter.outreach]
  - id: stage:schedule
    label: 13 · Schedule
    order: 13
    summary: A positive reply with a link, a slot or a deadline becomes an event on our calendar with a notification; conflicts become a reschedule draft in the review queue.

# ------------------------------------------------------------------ modules (layering: nothing imports upward)
modules:
  - id: module:jobhunter.targeting
    label: targeting.py
    path: jobhunter/targeting.py
    layer_order: 1
    summary: Company grading — hyped exclusion, funding window, the ₹50k stipend bar, the tier1/tier2/prospect bands. No network.
  - id: module:jobhunter.enrich
    label: enrich.py
    path: jobhunter/enrich.py
    layer_order: 2
    summary: Fills the registry from the research layer — what a company does, who funded it — then re-grades it.
  - id: module:jobhunter.hiring_verify
    label: hiring_verify.py
    path: jobhunter/hiring_verify.py
    layer_order: 2
    summary: Corroborates a hiring claim against the company's own ATS board or careers page; marks the unbacked ones not_authorized.
  - id: module:jobhunter.contacts.roles
    label: contacts/roles.py
    path: jobhunter/contacts/roles.py
    layer_order: 2
    summary: Role classification and referral ranking — founder · senior engineer · engineer · EM · tech HR · recruiter.
  - id: module:jobhunter.kg.hunt
    label: kg/hunt.py
    path: jobhunter/kg/hunt.py
    layer_order: 3
    summary: The graph as the decision surface — why <company>, shortlist, expand via investors, guard, audit.
  - id: module:jobhunter.db
    label: db.py
    path: jobhunter/db.py
    layer_order: 0
    summary: SQLModel models Company/Job/Contact/Email/Reply/Setting, engine, kv helpers.
  - id: module:jobhunter.llm
    label: llm.py
    path: jobhunter/llm.py
    layer_order: 0
    summary: The only place a model is called — Ollama chat, JSON mode with retry, embeddings, think-stripping.
  - id: module:jobhunter.normalize
    label: normalize.py
    path: jobhunter/normalize.py
    layer_order: 0
    summary: Relevance rules, dedup fingerprint, salary → INR LPA, mojibake repair.
    depends_on: [module:jobhunter.llm]
  - id: module:jobhunter.resume
    label: resume.py
    path: jobhunter/resume.py
    layer_order: 0
    summary: PDF/MD → profile.json via LLM, pulling hyperlinks from PDF annotations.
    depends_on: [module:jobhunter.llm]
  - id: module:jobhunter.notify
    label: notify.py
    path: jobhunter/notify.py
    layer_order: 0
    summary: macOS notifications for high matches and replies.
    depends_on: [module:jobhunter.db]
  - id: module:jobhunter.scrapers
    label: scrapers/
    path: jobhunter/scrapers/
    layer_order: 1
    summary: base.py (RawJob + async HTTP), discover.py (ATS probe), greenhouse · lever · ashby · hn_hiring · remoteok · wwr · yc.
    depends_on: [module:jobhunter.normalize]
  - id: module:jobhunter.contacts
    label: contacts/
    path: jobhunter/contacts/
    layer_order: 1
    summary: github_miner · site_scraper · patterns · hunter · verify; __init__ runs the waterfall.
    depends_on: [module:jobhunter.db, module:jobhunter.scrapers]
  - id: module:jobhunter.outreach
    label: outreach/
    path: jobhunter/outreach/
    layer_order: 1
    summary: researcher · drafter · gmail · sender · tracker.
    depends_on: [module:jobhunter.db, module:jobhunter.llm]
  - id: module:jobhunter.pipeline
    label: pipeline.py
    path: jobhunter/pipeline.py
    layer_order: 2
    summary: Scrape orchestration, company sync from companies.yaml, persist with dedup, LLM salary backfill.
    depends_on: [module:jobhunter.scrapers, module:jobhunter.normalize, module:jobhunter.db]
  - id: module:jobhunter.matcher
    label: matcher.py
    path: jobhunter/matcher.py
    layer_order: 2
    summary: Resume vector cache, percentile prefilter, rubric scoring with hard-rule caps, counts.
    depends_on: [module:jobhunter.llm, module:jobhunter.db]
  - id: module:jobhunter.scheduler
    label: scheduler.py
    path: jobhunter/scheduler.py
    layer_order: 2
    summary: APScheduler — daily scrape+score cycle, hourly reply poll; sequential on purpose (8 GB).
    depends_on: [module:jobhunter.pipeline, module:jobhunter.matcher, module:jobhunter.outreach, module:jobhunter.kg]
  - id: module:jobhunter.research
    label: research/
    path: jobhunter/research/
    layer_order: 1
    summary: Web-research backends — Exa/mcporter search, Jina Reader, GitHub, Reddit, YouTube; evidence-linked extraction; no DB writes.
    depends_on: [module:jobhunter.llm]
  - id: module:jobhunter.kg
    label: kg/
    path: jobhunter/kg/
    layer_order: 2
    summary: Knowledge graph — store (SQLite nodes/edges/FTS), context loader, data sync, compose, brief, export.
    depends_on: [module:jobhunter.db]
  - id: module:jobhunter.api
    label: api.py
    path: jobhunter/api.py
    layer_order: 3
    summary: FastAPI — reads, actions dispatched to background threads with task ids, config, kg routes.
    depends_on: [module:jobhunter.pipeline, module:jobhunter.matcher, module:jobhunter.contacts, module:jobhunter.outreach, module:jobhunter.kg]
  - id: module:scripts.run
    label: scripts/run.py
    path: scripts/run.py
    layer_order: 3
    summary: Typer CLI — doctor profile scrape score find-contacts draft gmail-auth send poll daily discover serve, plus the kg sub-commands.
    depends_on: [module:jobhunter.api]
  - id: module:dashboard
    label: dashboard/
    path: dashboard/
    layer_order: 4
    summary: Next.js 16 — Overview · Leads · Contacts · Queue · Tracker · Replies · Settings. Talks only to the REST API. Its own git repo.
    depends_on: [module:jobhunter.api]

# ------------------------------------------------------------------ job sources (ids match Job.source values)
sources:
  - {id: source:greenhouse, label: Greenhouse boards API, kind: ats, enabled: true, config_key: greenhouse, stage: stage:scrape, part_of: feature:ats-json-scrapers, endpoint: "boards-api.greenhouse.io/v1/boards/{slug}/jobs"}
