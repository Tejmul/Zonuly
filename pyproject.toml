[project]
name = "jobhunter"
version = "0.1.0"
description = "AI job-scraping & referral outreach agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.21",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "pypdf>=4.3",
    "dnspython>=2.6",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "playwright>=1.46",
    "numpy>=1.26",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
# Agent Reach is a TOOL (installer + doctor for the upstream research backends),
# not a library — nothing in jobhunter imports it. Prefer installing it in its own
# environment: pipx install "agent-reach @ <the URL below>". This extra exists for
# anyone who wants it inside the project venv instead: `uv sync --extra research`.
# PyPI's agent-reach is stale at 0.1.0; the GitHub archive is 1.5.x.
research = [
    "agent-reach @ https://github.com/Panniantong/Agent-Reach/archive/refs/heads/main.zip",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunter"]

[tool.hatch.metadata]
# The `research` extra points at a GitHub archive (Agent Reach has no current PyPI
# release). Hatchling rejects direct URLs in package metadata by default; this only
# lets the project build, it does not install the extra.
allow-direct-references = true
